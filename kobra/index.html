<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kobra</title>
<!-- Seit Toollib 0.22.0 ist Kobra ein Werkzeug in Toollib (#/m/kobra). Diese Adresse leitet nur noch dorthin. -->
<script>
  try { if (location.hash === '#settings') localStorage.setItem('kobra.open', JSON.stringify('settings')); } catch (e) { /* ohne Speicher */ }
  location.replace('../#/m/kobra');
</script>
</head>
<body><p><a href="../#/m/kobra">Kobra in Toollib öffnen</a></p></body>
</html>
